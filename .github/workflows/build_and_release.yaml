on触发条件触发条件:
  push:push:
    branches:
      - main
    paths:
      - 'BuildLog.md'
  workflow_dispatch: workflow_dispatch:
    inputs:
      publish:
        description: : Publish GitHub Release (disable for build-only validation)        描述: : 发发布 GitHub 发布版（仅用于构建验证时可禁用）        描述: : 发布 GitHub 发布版（仅用于构建验证时可禁用）        描述: : 发布 GitHub 发布版（仅用于构建验证时可禁用）
        type: boolean
        required: true
        default: true
env:环境:
  BUILD_TYPE:  构建类型: Release发布

jobs:作业:
  fetch-aseprite-info: 获取 Aseprite 信息:获取 Aseprite 信息:
    name: Fetch deps info 名称: 获提取依赖信息名称: 获取依赖信息 名称: 提取依赖信息名称: 获取依赖信息
    runs-on: ubuntu-latest 运行环境: 最最新版 Ubuntu 运行环境: 最新版 Ubuntu 运行环境: ubuntu-latest
    outputs: 输出项:
      download-link: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}      下载链接: ${{: ${{ steps.aseprite-link.outputs.download-link }}
      release-tag      发布标签: ${{: ${{ steps.aseprite-link.outputs.release-tag }}      发布标签: ${{: ${{ steps.aseprite-link.outputs.release-tag }}      发布标签: ${{: ${{ steps.aseprite-link.outputs.release-tag }}      发布标签: ${{: ${{ steps.aseprite-link.outputs.release-tag }}
    steps:: 步骤：:
      - name名称:       - 名称: Fetch Aseprite release link      - name名称:       - 名称: 获取 Aseprite 发布链接
        id        ID: : aseprite-link
        uses        使用: : a1393323447/fetch-release@main
        with        使用::        使用        使用::
            group            组            组            组: : aseprite            组            组: : aseprite
            repo            仓库: : aseprite            仓库            仓库: : aseprite            仓库            仓库: : aseprite            仓库            仓库: : aseprite
            match            匹配: : Aseprite-.*?-Source.zip            匹配            匹配: : Aseprite-.*?-Source.zip

  create-release创建发布::  创建发布::
    name: : Create Release创建发布    名称: : 创建发布创建发布    名称: : 创建发布
    runs-on: ubuntu-latest 运行环境: 最新版 Ubuntu 运行环境: ubuntu-latest
    needs: fetch-aseprite-info
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    permissions:    权限:
      contents: write      内容: 写入
    steps:步骤:
      - uses使用: actions/checkout@v7      - 使用: actions/checkout@v7
      - uses: ncipollo/release-action@v1.21.0      - 使用: ncipollo/release-action@v1.21.0
        with:        使用:
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}          标签: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
          body: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}
          skipIfReleaseExists: true
          token: ${{ secrets.GITHUB_TOKEN }}          令牌: ${{ secrets.GITHUB_TOKEN }}          令牌: ${{ secrets.GITHUB_TOKEN }}          令牌: ${{ secrets.GITHUB_TOKEN }}

  build-aseprite:
    name: Build Aseprite    名称: 构建 Aseprite    名称: 构建 Aseprite    名称: 构建 Aseprite
    needs: [fetch-aseprite-info, create-release]    需要: [获取Aseprite信息, 创建发布]
    if: >-
      ${{ !cancelled() && needs.fetch-aseprite-info.result == 'success' &&      ${{ !已取消() && 需要.获取Aseprite信息.结果 == '成功' &&
          (needs.create-release.result == 'success' ||
           (github.event_name == 'workflow_dispatch' && !inputs.publish &&
            needs.create-release.result == 'skipped')) }}
    permissions:    权限:
      contents: write      内容: 写入
    runs-on: ${{ matrix.os }}
    strategy:    策略:
        matrix:        矩阵:
          os: [ windows-latest ]          操作系统: [ windows-latest ]
        fail-fast: false        遇到错误即停止: false
    steps:步骤:
      - name: Install Dependencies
        if: runner.os == 'Linux'
        shell: bash        shell: bash
        run: |        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libpixman-1-dev libfreetype6-dev libharfbuzz-dev zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev \
            libfontconfig1-dev
      - uses: actions/checkout@v7
      - name: Install Aseprite
        shell: bash
        run: |
          git clone --recurse-submodules -j8 https://github.com/aseprite/aseprite --branch ${{ needs.fetch-aseprite-info.outputs.release-tag }}
      - name: Install Skia
        working-directory: aseprite
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]] ; then
            choco install wget -y --no-progress
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip
            unzip Skia-Windows-Release-x64.zip -d skia
          elif [[ "${{ runner.os }}" == "macOS" ]] ; then
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-macOS-Release-arm64.zip
            unzip Skia-macOS-Release-arm64.zip -d skia
          else          否则
            wget https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Linux-Release-x64.zip
            unzip Skia-Linux-Release-x64.zip -d skia
          fi
      - uses: aseprite/get-ninja@main
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - name: Generating Makefiles
        shell: bash
        working-directory: aseprite
        run: |
          export enable_ccache=off
          export laf_backend=skia
          export enable_scripting=on

          if [[ "${{ runner.os }}" == "macOS" ]] ; then          如果 [[ "${{ runner.os }}" == "macOS" ]] ; 则
            export skia_arch=arm64
          else          否则
            export skia_arch=x64
          fi

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.9 \
            -DENABLE_TESTS=OFF \
            -DENABLE_I18N_STRINGS=ON \
            -DENABLE_SCRIPTING=$enable_scripting \
            -DENABLE_CCACHE=$enable_ccache \
            -DLAF_BACKEND=$laf_backend \
            -DSKIA_DIR=$(realpath skia) \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DSKIA_LIBRARY_DIR=$(realpath skia/out/Release-$skia_arch)
      - name: Compiling
        shell: bash
        working-directory: aseprite
        run: |
          cd build && ninja
      - name: Clean Up Build folder
        working-directory: aseprite/build/bin
        shell: bash
        run: find . -mindepth 1 ! \( -name 'aseprite' -o -name 'aseprite.exe' -o -name 'data' -prune -o -name 'Aseprite.app' -prune \) -exec rm -rf {} +
      - name: Verify bundled translations
        working-directory: aseprite/build/bin
        shell: bash
        run: |
          data_dir=data
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            data_dir=Aseprite.app/Contents/Resources/data
          fi
          strings_dir="$data_dir/strings.git"

          translation_found=false
          for translation in "$strings_dir"/*.ini; do
            if [[ "${translation##*/}" != en.ini && -f "$translation" ]] &&
                grep -Eq '^[[:space:]]*\[[^]]+\]' "$translation"; then
              translation_found=true
              break
            fi
          done
          if [[ "$translation_found" != true ]]; then
            echo "No non-English translation content found in $strings_dir" >&2
            exit 1
          fi

          # Keep translations and licensing files; omit only Git metadata.
          rm -rf "$strings_dir/.git"
      - name: Make portable zip
        working-directory: aseprite/build/bin
        run: echo '# This file is here so Aseprite behaves as a portable program' > aseprite.ini
      - name: Create ZIP archive
        if: runner.os != 'macOS'
        working-directory: aseprite/build/bin
        run: 7z -tzip a Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip *
      - name: Package and verify macOS archive
        if: runner.os == 'macOS'
        timeout-minutes: 10
        working-directory: aseprite/build/bin
        shell: bash
        env:
          ARCHIVE_NAME: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
        run: bash "$GITHUB_WORKSPACE/.github/scripts/package-macos.sh" "$ARCHIVE_NAME"
      - name: Upload validation artifact
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish }}
        uses: actions/upload-artifact@v7
        with:
          name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}-${{ runner.arch }}-attempt${{ github.run_attempt }}
          path: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          if-no-files-found: error
          compression-level: 0
      - name: Upload release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: aseprite/build/bin/Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          asset_name: Aseprite-${{ needs.fetch-aseprite-info.outputs.release-tag }}-${{ runner.os }}.zip
          tag: ${{ needs.fetch-aseprite-info.outputs.release-tag }}
